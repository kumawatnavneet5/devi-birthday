<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Happy Birthday 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--ink:#5b1f6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Fredoka,system-ui,sans-serif;color:var(--ink);text-align:center;overflow:hidden;background:linear-gradient(160deg,#ffd0e6,#ffe8c2 45%,#c4efff);background-size:200% 200%;animation:bg 12s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
canvas{position:fixed;inset:0;z-index:30;pointer-events:none}
.pac{font-family:Pacifico,cursive;font-weight:400;margin:0}
#bunting{position:fixed;top:0;left:0;right:0;height:64px;z-index:4;display:flex;justify-content:space-around;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#bunting i{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:44px solid;transform-origin:50% -10px;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#ffd0e6,#ffe8c2,#c4efff);cursor:pointer;transition:opacity .6s,visibility .6s}
#gate.off{opacity:0;visibility:hidden}
.bigb{font-size:9rem;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(0,0,0,.2))}
@keyframes bob{50%{transform:translateY(-18px) scale(1.06)}}
#home{position:absolute;inset:0;z-index:5;padding:70px 18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow-y:auto}
.rv{opacity:0;transform:translateY(30px) scale(.85);transition:opacity .8s var(--d,0s),transform .8s var(--d,0s) cubic-bezier(.2,1.5,.4,1)}
.go .rv{opacity:1;transform:none}
h1.pac{font-size:clamp(2.4rem,12vw,3.8rem);color:#ff3d8b;text-shadow:3px 3px 0 #fff,0 8px 20px rgba(255,61,139,.3)}
.frame{position:relative;width:min(50vw,200px);aspect-ratio:4/5;padding:11px;border-radius:16px;background:linear-gradient(135deg,#ffe9a0,#f0a81c 50%,#ffe9a0);box-shadow:0 14px 30px rgba(120,50,0,.35),inset 0 0 0 3px #fff6d0;transform-origin:50% -20px;animation:swing 4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.frame .ph{width:100%;height:100%;border-radius:8px;border:3px solid #fff6d0;background:#ffe3f1 center/cover;display:flex;align-items:center;justify-content:center;font-size:4rem}
.frame:before{content:"🎀";position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:2.2rem}
.frame:after{content:"✨";position:absolute;right:-12px;bottom:-12px;font-size:1.8rem;animation:tw 1.3s infinite}
@keyframes tw{50%{transform:scale(1.5) rotate(20deg)}}
.name{font-size:1.9rem;color:#ff8a00;text-shadow:2px 2px 0 #fff}
.tag{margin:0;font-size:1rem;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,400px)}
.tile{border:0;border-radius:22px;padding:14px 6px;font:600 1rem Fredoka,sans-serif;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font-size:2.2rem;font-weight:400;animation:wob 2.4s ease-in-out infinite}
.tile:nth-child(2n) b{animation-delay:-1.2s}
@keyframes wob{50%{transform:rotate(-10deg) scale(1.12)}}
.tile:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sc{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 18px 24px;overflow:hidden;opacity:0;visibility:hidden;transform:var(--from);transition:transform .6s cubic-bezier(.2,1.2,.4,1),opacity .4s,visibility .6s}
.sc.on{opacity:1;visibility:visible;transform:none}
.x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#ff3d8b;font:600 1.3rem Fredoka;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:pointer;z-index:3}
.sc h2{font-family:Pacifico,cursive;font-weight:400;margin:0;font-size:2rem;color:#ff3d8b;text-shadow:2px 2px 0 #fff}
.teddy{font-size:11rem;line-height:1;cursor:pointer;animation:bob 2s ease-in-out infinite;user-select:none}
.teddy.hug{animation:hug .6s}
@keyframes hug{30%{transform:scale(1.3,.8)}60%{transform:scale(.85,1.2) rotate(6deg)}}
.bubble{background:#fff;border-radius:22px;padding:14px 20px;font-size:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,.12);position:relative;max-width:320px;min-height:3.4em;display:flex;align-items:center;justify-content:center}
.bubble:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom-color:#fff;border-top:0}
.string{position:absolute;top:60px;left:6%;right:6%;height:30px;border-top:3px dashed #b07a3a;border-radius:50%/100% 100% 0 0;opacity:.7}
.lights{position:absolute;top:70px;left:0;right:0;display:flex;justify-content:space-around;font-size:1.5rem;padding:0 10px}
.lights i{font-style:normal;animation:tw 1.2s infinite}
.pol{position:relative;width:min(72vw,290px);background:#fff;padding:14px 14px 50px;border-radius:6px;box-shadow:0 18px 30px rgba(0,0,0,.28);transform-origin:50% -30px;animation:swing 3.4s ease-in-out infinite alternate;margin-top:50px;cursor:pointer}
.pol .ph{background-position:center 30%!important;aspect-ratio:1;background:#ffe3f1 center/cover;display:flex;align-items:center;justify-content:center;font-size:5.5rem}
.pol .cap{font-family:Pacifico;font-size:1.5rem;color:#ff3d8b;position:absolute;bottom:10px;left:0;right:0}
.pol:before{content:"📌";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.8rem}
.paper{width:min(100%,430px);min-height:250px;padding:24px 22px;background:#fffdf3;border-radius:6px;background-image:repeating-linear-gradient(transparent,transparent 31px,#f4d9e4 32px);line-height:32px;font-size:1.1rem;text-align:left;white-space:pre-line;box-shadow:0 14px 26px rgba(0,0,0,.2);animation:slide .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes slide{from{transform:translateY(120px) rotate(-6deg);opacity:0}}
.cake{position:relative;width:200px;height:210px;cursor:pointer}
.cake .t{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.1)}
.t1{bottom:0;width:200px;height:70px;background:#ff8fb8}.t2{bottom:70px;width:150px;height:58px;background:#ffd35c}.t3{bottom:128px;width:100px;height:44px;background:#b69cff}
.cd{position:absolute;bottom:170px;width:7px;height:26px;background:repeating-linear-gradient(45deg,#fff,#fff 4px,#ff4d8d 4px,#ff4d8d 8px);border-radius:3px}
.fl{position:absolute;bottom:196px;width:12px;height:20px;margin-left:-2px;border-radius:50%/60% 60% 40% 40%;background:radial-gradient(#fff,#ffd166 50%,#ff7a18);box-shadow:0 0 18px 6px rgba(255,170,60,.7);animation:fire .25s ease-in-out infinite alternate;transform-origin:50% 100%;transition:.4s}
@keyframes fire{to{transform:scale(1.15,.9) rotate(4deg)}}
.fl.out{opacity:0;transform:scale(0)}
#bal{position:relative;width:100%;max-width:420px;height:50vh;margin-top:6px}
.bl{position:absolute;bottom:0;width:70px;height:88px;border:0;border-radius:50% 50% 48% 48%;cursor:pointer;animation:rise 6s ease-in-out infinite alternate;box-shadow:inset -8px -8px 0 rgba(0,0,0,.1),inset 8px 8px 0 rgba(255,255,255,.35)}
.bl:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;background:#8a6a8f}
@keyframes rise{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-34vh) rotate(5deg)}}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:2.4em;max-width:420px}
#chips span{background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.12);animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.hb{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-family:Pacifico;font-size:clamp(2.2rem,12vw,3.6rem);line-height:1.15}
.hb span{display:inline-block;animation:bounce 1.2s ease-in-out infinite;color:hsl(var(--h),90%,55%);text-shadow:2px 2px 0 #fff}
@keyframes bounce{50%{transform:translateY(-14px) rotate(4deg)}}
.fe{position:fixed;bottom:-40px;z-index:25;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bunting"></div>

<div id="gate"><div class="bigb">🎈</div><div class="pac" style="font-size:1.8rem;color:#ff3d8b">Tap to pop!</div></div>

<main id="home">
  <h1 class="pac rv" style="--d:.1s">Happy Birthday</h1>
  <div class="frame rv" style="--d:.5s"><div class="ph">🌸</div></div>
  <div class="pac name rv" style="--d:.9s">My Devi 🙏</div>
  <p class="tag rv" style="--d:1.2s">Tap the buttons to open your surprises 💖</p>
  <div class="grid rv" style="--d:1.5s">
    <button class="tile" data-s="0" style="background:#ff6fa5"><b>🧸</b>Teddy Hug</button>
    <button class="tile" data-s="1" style="background:#ff9a3c"><b>📸</b>Your Photo</button>
    <button class="tile" data-s="2" style="background:#8f6bff"><b>💌</b>My Wish</button>
    <button class="tile" data-s="3" style="background:#20b8e8"><b>🎂</b>Make a Wish</button>
    <button class="tile" data-s="4" style="background:#2ec27e"><b>🎈</b>Pop Balloons</button>
    <button class="tile" data-s="5" style="background:#ee4040"><b>🎆</b>Big Surprise</button>
  </div>
</main>

<!-- Teddy -->
<div class="sc" id="s0" style="--from:translateY(100%)"><button class="x">✕</button>
  <h2>Teddy Hug</h2><div class="teddy" id="teddy">🧸</div><div class="bubble" id="bub">Tap me for a big hug!</div></div>
<!-- Photo -->
<div class="sc" id="s1" style="--from:rotate(-12deg) scale(.4)"><button class="x">✕</button>
  <div class="string"></div><div class="lights"><i>💡</i><i style="animation-delay:.3s">✨</i><i style="animation-delay:.6s">💡</i><i style="animation-delay:.9s">✨</i><i>💡</i></div>
  <div class="pol" id="pol"><div class="ph">🌸</div><div class="cap">My Devi 💖</div></div><p class="tag">Tap the photo for sparkles ✨</p></div>
<!-- Wish letter -->
<div class="sc" id="s2" style="--from:translateX(100%)"><button class="x">✕</button>
  <h2>A Letter For You 💌</h2><div class="paper" id="paper"></div></div>
<!-- Cake -->
<div class="sc" id="s3" style="--from:scale(.2)"><button class="x">✕</button>
  <h2>Make a Wish 🎂</h2>
  <div class="cake" id="cake"><div class="t t1"></div><div class="t t2"></div><div class="t t3"></div>
    <div class="cd" style="left:68px"></div><div class="fl" style="left:68px"></div>
    <div class="cd" style="left:97px"></div><div class="fl" style="left:97px"></div>
    <div class="cd" style="left:126px"></div><div class="fl" style="left:126px"></div></div>
  <div class="pac" id="cm" style="font-size:1.25rem;color:#fff;background:linear-gradient(90deg,#ff3d8b,#ff8a00);padding:12px 22px;border-radius:24px;box-shadow:0 7px 0 rgba(0,0,0,.18);max-width:330px;min-height:3.4em;display:flex;align-items:center;justify-content:center;line-height:1.4;margin-top:14px;position:relative;z-index:2">Tap the cake, close your eyes and wish!</div></div>
<!-- Balloons -->
<div class="sc" id="s4" style="--from:translateY(-100%)"><button class="x">✕</button>
  <h2>Pop the Balloons 🎈</h2><div id="chips"></div><div id="bal"></div></div>
<!-- Surprise -->
<div class="sc" id="s5" style="--from:scale(2.5)"><button class="x">✕</button>
  <div class="hb" id="hb"></div><div class="pac" style="font-size:1.6rem;color:#fff;background:linear-gradient(90deg,#ff3d8b,#ff8a00);padding:12px 26px;border-radius:999px;box-shadow:0 7px 0 rgba(0,0,0,.18);margin-top:18px;position:relative;z-index:2;line-height:1.3">to my lovely Devi 💖</div></div>
